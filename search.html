<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search</title>
    <script src="search_script.js" defer></script>
    <link rel="stylesheet" href="style_common.css">
    <link rel="stylesheet" href="style_search.css">
</head>
<body>

    <header>

        <nav>

            <div  class="container" id="nav">

                <a id="logo" href="index.html" title="Back to home page">
                    <img src="logo.svg" alt="Logo">
                </a>
                
                
                <div id="list">

                    <a href="categorie.html">Our recipes</a>

                    <a href="random.html">Food roulette</a>

                    <a href="first-letter.html">A - Z</a>

                    <a href="search.html" class="active">Search</a>

                </div>
                
            </div>

        </nav>

    </header>

    <main class="container">

        <fieldset class="search-section">
            <h1>Search for a dish</h1>
            <input type="text" id="search-input" placeholder="Enter a dish name (e.g. Arrabiata)...">
            <select id="country-select" aria-label="Country">
                <option value="">All countries</option>
            </select>
            <button id="search-button" aria-label="Search">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
                    <circle cx="11" cy="11" r="7"></circle>
                    <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
                </svg>
            </button>
        </fieldset>

        <div id="results-container" class="grid-container"></div>

    </main>

    <footer>

        <div class="container">

            <P>Abbassi Nabil  All rights reserved 2026</P>

        </div>

    </footer>

</body>
</html>
